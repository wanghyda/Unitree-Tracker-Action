mpc_optimization_server:
  ros__parameters:
    acc_x_limit: 2.1                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
    acc_y_limit: 2.1
    acc_theta_limit: 2.0    
    min_vel_x: -0.5                     
    min_vel_y: -0.5
    min_vel_trans: -0.5
    min_vel_theta: -1.0
    max_vel_x: 0.5
    max_vel_y: 0.5
    max_vel_trans: 0.5
    max_vel_theta: 0.5

    # Translation error weight 
    w_trans: 0.82
    # Orientation error weight 
    w_orient: 0.02
    # Control error weight 
    w_control: 0.20 #0.20
    # Terminal weight 
    w_terminal: 0.20
    # Footprint weight 
    w_footprint: 3
    # Costmap weight 
    w_costmap: 2.0
    # Waiting time before the robot can try a maneuver, after it had been stuck in the obstacle  
    waiting_time: 1.0
    low_pass_gain: 0.5
    # Optimization tolerance, smaller it is, slower the performance
    opt_tolerance: 0.1
    # Time period, upto which MPC has to predict the control commands 
    prediction_horizon: 1.6
    # Number of steps that the prediction horizon needs to be splitted into
    control_steps: 3
    





